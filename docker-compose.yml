services:
  db:
    image: postgres:16
    container_name: poleapp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: poleapp
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: poleapp-web
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/poleapp?schema=poleapp
      NEXTAUTH_SECRET: dev-secret-change-me
      NEXTAUTH_URL: http://localhost:3000
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        npm run db:push &&
        npm run db:seed &&
        npm run dev -- --hostname 0.0.0.0 --port 3000
      "
    develop:
      watch:
        - path: .
          target: /app
          action: sync
          ignore:
            - node_modules/
            - .next/
            - .git/
            - docker-compose.yml
            - Dockerfile
            - prisma/dev.db
        - path: package-lock.json
          action: rebuild
        - path: package.json
          action: rebuild
        - path: prisma/schema.prisma
          action: rebuild
    ports:
      - "3000:3000"

volumes:
  db_data:
