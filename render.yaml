databases:
  - name: poleapp-db
    plan: free
    databaseName: poleapp
    user: poleapp

services:
  - type: web
    name: poleapp
    env: node
    plan: free
    branch: main
    buildCommand: npm install && npx prisma db push && npx prisma generate && npm run build
    startCommand: npm run db:push && npm run db:seed && npm run start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: poleapp-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://poleapp.onrender.com
