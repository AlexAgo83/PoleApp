databases:
  - name: poleapp-db
    region: frankfurt
    plan: free
    databaseName: poleapp
    user: poleapp

services:
  - type: web
    name: poleapp
    env: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm install && npm run db:migrate:deploy && npm run build
    startCommand: npm run start:render
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: poleapp-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://poleapp.onrender.com
